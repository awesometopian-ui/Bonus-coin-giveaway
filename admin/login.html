<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login · Bonus Coin Giveaway</title><link rel="stylesheet" href="/admin/css/admin.css"></head>
<body style="background:#06151f">
<main style="min-height:100vh;display:grid;place-items:center;padding:18px"><section class="panel" style="width:min(420px,100%);padding:28px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:24px"><span class="mark">B</span><div><strong>Bonus Coin Giveaway</strong><small style="display:block;color:#16b86a;font-weight:800">ADMIN PANEL</small></div></div><h1 style="font-size:25px;margin:0 0 5px">Admin Login</h1><p class="muted">Sign in to manage the giveaway platform.</p><form id="loginForm" style="display:grid;gap:14px;margin-top:20px"><div class="form-row"><label>Username / Email</label><input id="username" autocomplete="username" required></div><div class="form-row"><label>Password</label><div style="position:relative"><input id="password" type="password" autocomplete="current-password" required style="width:100%;padding-right:70px"><button type="button" id="toggle" style="position:absolute;right:6px;top:6px;border:0;background:#edf4f1;border-radius:7px;padding:5px 8px;font-size:11px">Show</button></div></div><p id="error" class="flash"></p><button class="btn primary" type="submit">Login</button></form></section></main><script>
const f=document.getElementById('loginForm');document.getElementById('toggle').onclick=()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';document.getElementById('toggle').textContent=p.type==='password'?'Show':'Hide'};
f.onsubmit=async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok){error.textContent=d.error||'Login failed';return}location.href='/admin/dashboard'};
</script></body></html>
