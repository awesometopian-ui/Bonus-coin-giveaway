<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Giveaway · Bonus Coin Giveaway</title><link rel="stylesheet" href="/admin/css/admin.css"></head><body><div class="admin-shell"><aside class="sidebar"><div class="admin-brand"><span class="mark">B</span><div><strong>Bonus Coin</strong><small>ADMIN PANEL</small></div></div><nav class="side-nav">
<a href="/admin/dashboard">Dashboard</a><a href="/admin/giveaway">Manage Giveaway</a><a href="/admin/fields">Fields</a><a href="/admin/submissions">Submissions</a><a href="/admin/winner">Winner</a></nav><button id="logout" class="logout">Logout</button></aside><main class="admin-main"><div class="topbar"><div><h1>Manage Giveaway</h1><span class="muted">Configure what visitors see on the public website.</span></div><button class="btn primary" id="newBtn">+ New Giveaway</button></div><section class="panel"><h2>Giveaway</h2><div id="flash" class="flash"></div><form id="giveawayForm" class="form-grid"><input type="hidden" id="id"><div class="form-row"><label>Title</label><input id="title" required></div><div class="form-row"><label>Reward information</label><input id="reward_information" placeholder="Optional reward details"></div><div class="form-row full"><label>Description</label><textarea id="description" rows="4"></textarea></div><div class="form-row full"><label>Reward image URL (optional)</label><input id="image_url" type="url" placeholder="https://…"></div><div class="form-row"><label>Start date</label><input id="start_date" type="datetime-local"></div><div class="form-row"><label>End date</label><input id="end_date" type="datetime-local"></div><div class="form-row full"><label class="check"><input id="is_active" type="checkbox"> Active</label></div><div class="form-row full"><button class="btn primary" type="submit">Save Giveaway</button></div></form></section><section class="panel" style="margin-top:16px"><h2 id="settings">Welcome & security messages</h2><form id="settingsForm" class="form-grid"><div class="form-row full"><label>Welcome heading</label><input id="welcome_heading"></div><div class="form-row full"><label>Welcome message</label><textarea id="welcome_message" rows="4"></textarea></div><div class="form-row full"><label>Security message</label><textarea id="security_message" rows="3"></textarea></div><div class="form-row"><label>Primary button text</label><input id="primary_button_text"></div><div class="form-row"><label>Secondary button text</label><input id="secondary_button_text"></div><div class="form-row full"><button class="btn primary" type="submit">Save Public Content</button></div></form></section><section class="panel" style="margin-top:16px"><h2>Saved giveaways</h2><div class="table-wrap"><table class="table"><thead><tr><th>Title</th><th>Status</th><th>Dates</th><th>Action</th></tr></thead><tbody id="giveaways"></tbody></table></div></section></main></div><script src="/admin/js/common.js"></script><script src="/admin/js/giveaway.js"></script></body></html>
